services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pollbuilder
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pollbuilder-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=pollbuilder;Username=postgres;Password=postgres"

volumes:
  pollbuilder-data: